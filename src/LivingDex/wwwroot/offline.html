:root{color-scheme:dark;--night:#0c1222;--ink:#e8edf8;--muted:#8c9abb;--soft:#aab6e0;--line:#3a4b85;--gold:#ffd23f;
  --pixel:"DotGothic16",ui-monospace,monospace;--tiny:"Silkscreen","DotGothic16",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--night);color:var(--ink)}
body{font-family:var(--pixel);display:grid;place-items:center;padding:env(safe-area-inset-top) 26px env(safe-area-inset-bottom);background:
  linear-gradient(rgba(120,150,255,.05) 1px,transparent 1px) 0 0/24px 24px,
  linear-gradient(90deg,rgba(120,150,255,.05) 1px,transparent 1px) 0 0/24px 24px,var(--night)}
main{max-width:340px;display:grid;justify-items:center;gap:14px;text-align:center}
.ball{width:58px;height:58px;border-radius:50%;position:relative;background:linear-gradient(#e3363a 0 45%,#141414 45% 55%,#f2f2f2 55%);box-shadow:0 0 0 3.5px #141414;filter:grayscale(1) brightness(.55)}
.ball::after{content:"";position:absolute;inset:0;margin:auto;width:32%;height:32%;border-radius:50%;background:#f2f2f2;box-shadow:0 0 0 3.5px #141414}
h1{margin:4px 0 0;font-weight:400;font-size:1.45rem;text-wrap:balance}
p{margin:0;font-size:.95rem;line-height:1.55;color:var(--soft)}
button{margin-top:6px;border:0;cursor:pointer;font:.7rem var(--tiny);letter-spacing:.14em;color:#fff;padding:14px 26px;
  clip-path:polygon(10px 0,calc(100% - 10px) 0,100% 50%,calc(100% - 10px) 100%,10px 100%,0 50%);background:linear-gradient(#e64a4e,#b81f24)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.dots{display:flex;gap:6px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--line);animation:dot 1.4s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{40%{background:var(--gold)}}
small{font:.5rem/1.7 var(--tiny);letter-spacing:.12em;color:#56618a}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}}
</style>
</head>
<body>
<main>
  <div class="ball" aria-hidden="true"></div>
  <h1>Can't reach your server</h1>
  <p>Living Dex runs on your NAS. Check that you're on your home Wi-Fi (or your VPN), then try again.</p>
  <button type="button" id="retry">TRY AGAIN</button>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  <small id="msg" role="status">RETRIES BY ITSELF WHEN YOU'RE BACK ONLINE</small>
</main>
<script>
(function(){
  var busy=false, msg=document.getElementById('msg'), idle=msg.textContent;
  function check(manual){
    if(busy) return; busy=true; if(manual) msg.textContent='TRYING…';
    fetch('/api/health',{cache:'no-store'}).then(function(r){ if(r.ok) location.reload(); else throw 0; })
      .catch(function(){ if(manual) msg.textContent='STILL CAN’T REACH IT'; setTimeout(function(){ msg.textContent=idle; },2500); })
      .then(function(){ busy=false; });
  }
  document.getElementById('retry').onclick=function(){ check(true); };
  window.addEventListener('online',function(){ check(false); });
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) check(false); });
  setInterval(function(){ if(!document.hidden) check(false); },5000);
})();
</script>
</body>
</html>
