# HOME Living Dex on a NAS: SQL Server, the database deploy (runs once per "up" and exits) and the app.
# Put SQL_SA_PASSWORD in a .env file next to this one (see .env.example), then:  docker compose up -d --build
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: livingdex-sql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
      # Keeps SQL Server from taking most of the NAS memory.
      MSSQL_MEMORY_LIMIT_MB: ${SQL_MEMORY_LIMIT_MB:-1024}
      TZ: Europe/Lisbon
    ports:
      # For SSMS / Azure Data Studio / VS Code on the LAN (server: <nas-ip>,1433 · user: sa).
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - livingdex-sql:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Publishes LivingDex.Database (tables + stored procedures) and exits: creates the database the first time,
  # applies schema changes on later deploys.
  db-deploy:
    build:
      context: .
      dockerfile: LivingDex.Database/Dockerfile
    image: livingdex-db-deploy:latest
    container_name: livingdex-db-deploy
    restart: "no"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      SQL_SERVER: sqlserver
      SQL_DATABASE: LivingDex
      SQL_USER: sa
      SQL_PASSWORD: ${SQL_SA_PASSWORD}

  livingdex:
    build:
      context: .
      dockerfile: LivingDex.WebApi/Dockerfile
    image: livingdex:latest
    container_name: livingdex
    restart: unless-stopped
    depends_on:
      db-deploy:
        condition: service_completed_successfully
    ports:
      - "8085:8080"
    environment:
      ConnectionStrings__LivingDex: "Server=sqlserver,1433;Database=LivingDex;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True"
      # Set to "false" once everyone who needs an account has one (the first account can always be created).
      LivingDex__AllowRegistration: ${LIVINGDEX_ALLOW_REGISTRATION:-true}
      # Set to "true" if a reverse proxy (nginx, Traefik…) sits in front of the app.
      LivingDex__BehindProxy: ${LIVINGDEX_BEHIND_PROXY:-false}
      # Showdown battles: seconds per turn, or "false" on the second line to turn battles off.
      LivingDex__TurnSeconds: ${LIVINGDEX_TURN_SECONDS:-60}
      LivingDex__ShowdownEnabled: ${LIVINGDEX_SHOWDOWN:-true}
      TZ: Europe/Lisbon
    volumes:
      # Login keys, the download cache and (until it is imported) the old livingdex.db.
      - livingdex-data:/data

volumes:
  livingdex-data:
  livingdex-sql:
