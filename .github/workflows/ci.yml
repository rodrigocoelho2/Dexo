name: CI

on:
  push:
    branches: [main, restructure]
  pull_request:
  workflow_dispatch:

# contents: write lets each job push its logs and screenshots to a ci-output-* branch for review.
permissions:
  contents: write

# bash -eo pipefail: a failing command still fails its step when its output is piped into tee.
defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SA_PASSWORD: LivingDex-CI-2026!

jobs:
  build-test:
    name: Build, database and tests
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Express
          MSSQL_SA_PASSWORD: LivingDex-CI-2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'LivingDex-CI-2026!' -C -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: mkdir -p ci-output && dotnet restore LivingDex.slnx 2>&1 | tee ci-output/1-restore.log

      - name: Build (Library, WebApi, UnitTest and the LivingDex.Database dacpac)
        run: |
          dotnet build LivingDex.slnx -c Release --no-restore 2>&1 | tee ci-output/2-build.log
          dotnet build LivingDex.Database/LivingDex.Database.sqlproj -c Release 2>&1 | tee -a ci-output/2-build.log

      - name: Publish the dacpac to SQL Server
        env:
          DOTNET_ROLL_FORWARD: Major
        run: |
          exec > >(tee ci-output/3-dacpac.log) 2>&1
          dotnet tool install --global microsoft.sqlpackage
          dacpac=$(find LivingDex.Database/bin -name 'LivingDex.Database.dacpac' | head -n 1)
          sqlpackage /Action:Publish /SourceFile:"$dacpac" \
            /TargetServerName:localhost /TargetDatabaseName:LivingDex \
            /TargetUser:sa /TargetPassword:"$SA_PASSWORD" /TargetTrustServerCertificate:True \
            /p:BlockOnPossibleDataLoss=True
          # A second publish must find nothing to change.
          sqlpackage /Action:Publish /SourceFile:"$dacpac" \
            /TargetServerName:localhost /TargetDatabaseName:LivingDex \
            /TargetUser:sa /TargetPassword:"$SA_PASSWORD" /TargetTrustServerCertificate:True \
            /p:BlockOnPossibleDataLoss=True

      - name: Test (unit + SQL Server integration)
        env:
          LIVINGDEX_TEST_SQL: Server=localhost,1433;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True
        run: >-
          dotnet test LivingDex.UnitTest/LivingDex.UnitTest.csproj -c Release --no-build
          --logger "trx;LogFileName=tests.trx" --logger "console;verbosity=normal" --results-directory TestResults
          2>&1 | tee ci-output/4-test.log

      - name: Push the logs to the ci-output-build branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/push-output.sh ci-output-build

  compose:
    name: Docker Compose end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start SQL Server, deploy the database and start the app
        run: |
          mkdir -p ci-output
          echo "SQL_SA_PASSWORD=$SA_PASSWORD" > .env
          docker network create nas-net
          docker compose up -d --build --wait livingdex 2>&1 | tee ci-output/1-compose-up.log

      - name: Smoke test
        run: |
          exec > >(tee ci-output/2-smoke.log) 2>&1
          set -e
          for i in $(seq 1 60); do curl -fs http://localhost:8085/api/health && break; sleep 2; done
          echo
          curl -fs http://localhost:8085/ | grep -q "HOME Living Dex"
          curl -fs -o /dev/null http://localhost:8085/fonts/fonts.css
          # The page's parts: the stylesheet, the scripts and the data it links (each as /file?v=hash).
          for f in $(curl -fs http://localhost:8085/ | grep -oE '(href|src)="/(css|js|data)/[^"]+"' | cut -d'"' -f2); do
            curl -fs -o /dev/null "http://localhost:8085$f" || { echo "missing: $f"; exit 1; }
          done
          curl -fs -o /dev/null http://localhost:8085/data/encounters.json
          # Served from the bundled LivingDex.Assets folder (no download, no redirect).
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8085/assets/sprites/versions/generation-iii/ruby-sapphire/25.png)
          echo "bundled sprite: $code"; test "$code" = 200
          jar=$(mktemp)
          curl -fs -c $jar -b $jar -H 'X-LivingDex: 1' -H 'Content-Type: application/json' \
            -d '{"username":"Rodas","password":"pikachu123"}' http://localhost:8085/api/auth/register
          echo
          curl -fs -c $jar -b $jar -X PUT -H 'X-LivingDex: 1' -H 'Content-Type: application/json' \
            -d '{"revision":0,"client":"ci","data":{"caught":{"home|normal":["s:1","s:4"]}}}' http://localhost:8085/api/state
          echo
          curl -fs -b $jar http://localhost:8085/api/showdown/trainers
          echo
          # The image must run the Pokémon Showdown simulator.
          for i in $(seq 1 30); do curl -fs -b $jar http://localhost:8085/api/showdown/status | grep -q '"available":true' && break; sleep 2; done
          curl -fs -b $jar http://localhost:8085/api/showdown/status | grep -q '"available":true'
          echo "Showdown simulator is running"
          # Daily Red: the simulator makes today's team and the server stores it.
          day=$(curl -fs -b $jar "http://localhost:8085/api/dailyred?date=$(date -u +%F)")
          echo "$day" | head -c 400; echo
          echo "$day" | grep -q '"team":\[{' && echo "$day" | grep -q '"red":\[{'
          echo "Daily Red team is ready"

      - name: Page screenshots
        run: |
          pip install --quiet playwright==1.55.0
          python -m playwright install --with-deps chromium > /dev/null
          set -o pipefail
          python .github/scripts/screenshots.py http://localhost:8085 ci-output/screenshots 2>&1 | tee ci-output/3-screenshots.log

      - name: Push the logs and screenshots to the ci-output-compose branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker compose ps -a > ci-output/9-compose-ps.log 2>&1 || true
          docker compose logs --no-color > ci-output/9-compose-logs.log 2>&1 || true
          .github/scripts/push-output.sh ci-output-compose
