<title>HOME Living Dex</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
/* Layout: a DS-era summary screen (left, sticky) beside a PC box of 6x5 slots (right); stacks on phones. Single dark look by choice. */
:root{
  --night:#0c1222;          /* page ground */
  --navy:#1d2c52;           /* summary screen base */
  --band:#33508f;           /* diagonal light band */
  --bar:#dfe6f2;            /* value bars */
  --bar-ink:#3a3f4a;        /* text on value bars */
  --bar-shade:#aeb8c8;      /* DS-style text shadow on bars */
  --label:#ffffff;
  --label-shade:#22355e;
  --red:#ef3d4f;
  --blue:#2f7fe6;
  --exp:#4ab4ff;
  --lav:#c3aef0;
  --ink:#e8edf8;
  --muted:#8c9abb;
  --line:#2a3a64;
  --panel:#141d36;
  --ok:#5fd38a;
  --pixel:"DotGothic16","MS Gothic","Osaka",ui-monospace,monospace;
  --tiny:"Silkscreen","DotGothic16",ui-monospace,monospace;
  --gb:"Press Start 2P","Silkscreen",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--night);color:var(--ink)}
body{font-family:var(--pixel);font-size:15px;line-height:1.35;padding-inline:16px;padding-block:18px 40px;
  background-image:linear-gradient(var(--night),var(--night)),radial-gradient(circle at 1px 1px,#1a2440 1px,transparent 0);
  background-size:auto,14px 14px;background-blend-mode:normal}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 1px 1px,rgba(120,150,220,.09) 1px,transparent 0);background-size:12px 12px;z-index:0}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;display:grid;gap:14px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--exp);outline-offset:2px}

/* ---------- Top: title + cartridges ---------- */
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 18px}
.brand{display:flex;align-items:center;gap:12px}
.brand h1{margin:0;font-size:1.7rem;letter-spacing:.06em;font-weight:400;text-shadow:2px 2px 0 var(--label-shade)}
.brand small{display:block;font-family:var(--tiny);font-size:.62rem;letter-spacing:.14em;color:var(--muted)}
.ball{--s:30px;width:var(--s);height:var(--s);border-radius:50%;flex:none;position:relative;
  background:linear-gradient(var(--red) 0 46%,#151515 46% 54%,#f4f4f4 54%);box-shadow:inset 0 0 0 2px #151515}
.ball::after{content:"";position:absolute;inset:34%;border-radius:50%;background:#f4f4f4;box-shadow:0 0 0 2px #151515}
.overall{font-family:var(--tiny);font-size:.7rem;color:var(--muted);text-align:right}
.overall b{color:var(--ink);font-size:1.1rem;font-family:var(--pixel);font-weight:400}

.carts{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cart{flex:none;min-width:104px;text-align:left;border:0;padding:7px 10px 8px;border-radius:6px 6px 3px 3px;
  background:linear-gradient(180deg,#2a3558,#1a2240);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 #070b16;position:relative}
.cart::before{content:"";position:absolute;left:8px;right:8px;top:0;height:4px;background:var(--c);border-radius:0 0 3px 3px}
.cart .s{font-family:var(--tiny);font-size:.82rem;letter-spacing:.06em;display:block;margin-top:2px}
.cart .n{font-size:.68rem;color:var(--muted);display:block;white-space:nowrap}
.cart .p{display:block;height:4px;background:#0b1020;border-radius:2px;margin-top:6px;overflow:hidden}
.cart .p i{display:block;height:100%;background:var(--c)}
.cart[aria-pressed="true"]{background:linear-gradient(180deg,#3c4f86,#25335e);transform:translateY(-2px);box-shadow:inset 0 2px 0 rgba(255,255,255,.2),0 5px 0 #070b16}

/* ---------- Controls ---------- */
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:10px 12px}
.grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.grp>span{font-family:var(--tiny);font-size:.62rem;letter-spacing:.12em;color:var(--muted);margin-right:2px}
.chip{border:0;border-radius:4px;padding:5px 9px;background:#222e52;color:var(--ink);font-size:.82rem;box-shadow:0 2px 0 #0a0f1e}
.chip[aria-pressed="true"]{background:var(--bar);color:var(--bar-ink);text-shadow:1px 1px 0 var(--bar-shade)}
.chip small{font-family:var(--tiny);font-size:.6rem;opacity:.75;margin-left:4px}
.search{display:flex;gap:6px;flex:1 1 220px;min-width:0}
.search input{flex:1;min-width:0;background:#0b1122;border:2px solid var(--line);border-radius:4px;padding:5px 8px}
.toggle{display:flex;align-items:center;gap:6px;font-size:.82rem;color:var(--ink);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--exp);width:16px;height:16px}

/* ---------- Main 2-up ---------- */
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}

/* ---------- Summary screen (B2-style) ---------- */
.dsframe{container-type:inline-size;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);background:#0a0d16;border-radius:14px;padding:10px;box-shadow:0 0 0 2px #1d2438,0 10px 30px rgba(0,0,0,.45)}
@media (max-width:900px){.dsframe{position:relative;top:0}}
.screen{aspect-ratio:4/3;width:100%;border-radius:4px;overflow:hidden;position:relative;
  background:
   linear-gradient(118deg,transparent 0 47%,var(--band) 47% 61%,transparent 61%),
   linear-gradient(118deg,transparent 0 64%,rgba(70,100,170,.45) 64% 68%,transparent 68%),
   var(--navy);
  display:grid;grid-template-rows:12% repeat(5,8.6%) 8.5% 9% 15.5% 12%;font-size:3.4cqw;line-height:1;image-rendering:pixelated}
.screen *{text-rendering:optimizeSpeed}
.row{position:relative;display:flex;align-items:center;padding-left:3%}
.lbl{color:var(--label);text-shadow:.12em .12em 0 var(--label-shade);width:30%;flex:none;white-space:nowrap;letter-spacing:.02em}
.val{position:absolute;left:31%;right:42%;top:12%;bottom:12%;display:flex;align-items:center;gap:.4em;padding:0 .5em 0 .8em;
  background:var(--bar);color:var(--bar-ink);text-shadow:.1em .1em 0 var(--bar-shade);clip-path:polygon(.55em 0,100% 0,100% 100%,0 100%);white-space:nowrap;overflow:hidden}
.val.red{color:var(--red);text-shadow:.1em .1em 0 #f4b8bf}
.val.blue{color:var(--blue);text-shadow:.1em .1em 0 #b9d2f4}
.val small{font-size:.66em;color:#6a7385;text-shadow:none}
.types{gap:.3em}
.type{display:inline-block;padding:.12em .4em .14em;border-radius:.3em;font-size:.76em;color:#fff;text-shadow:.1em .1em 0 rgba(0,0,0,.35);box-shadow:inset 0 0 0 .1em rgba(255,255,255,.35)}
.head{display:flex;justify-content:flex-end;padding:1.2% 1.4% 0}
.plate{width:44%;height:100%;background:linear-gradient(180deg,#141b30,#0c1222);border-radius:.4em .4em .4em 1em;display:grid;grid-template-rows:1fr 1fr;padding:.2em .5em;box-shadow:inset 0 0 0 .1em #3a4c80}
.plate .l1{display:flex;align-items:center;gap:.35em;white-space:nowrap;overflow:hidden}
.plate .l1 .ball{--s:1em;box-shadow:inset 0 0 0 .1em #151515}
.plate .l1 .ball::after{box-shadow:0 0 0 .1em #151515}
.plate .nm{color:#fff;overflow:hidden;text-overflow:ellipsis}
.sex{margin-left:auto;font-size:.95em}
.sex.f{color:#ff7a9a}.sex.m{color:#59a7ff}
.plate .l2{display:flex;align-items:center;justify-content:space-between;gap:.4em;font-size:.82em}
.plate .lv{color:#fff}
.pill{background:var(--lav);color:#2b2350;padding:.08em .5em;border-radius:.2em;font-size:.82em;white-space:nowrap}
.pill.miss{background:#7d879e;color:#1c2236}
.pill.ok{background:var(--ok);color:#0f2a1a}
.stage{position:absolute;right:2%;top:13%;width:38%;height:42%;display:grid;justify-items:center;align-items:end;padding-bottom:3%;pointer-events:none}
.stage::before{content:"";position:absolute;inset:6% 0 0 4%;background:repeating-linear-gradient(118deg,rgba(255,255,255,.18) 0 .35em,transparent .35em .9em);clip-path:polygon(18% 0,100% 0,82% 100%,0 100%)}
/* Native game scale: 1 sprite pixel = 1 DS pixel on a 256-px-wide screen, so evolutions keep their in-game size difference */
.stage img{position:relative;width:calc(var(--nw,96) * 100cqw / 256);height:auto;max-width:100%;max-height:100%;object-fit:contain;object-position:bottom;image-rendering:pixelated;filter:drop-shadow(.15em .2em 0 rgba(0,0,0,.25));visibility:hidden}
.stage img.ready{visibility:visible}
.stage .star{position:absolute;left:2%;bottom:0;color:var(--red);font-size:1.1em;text-shadow:.08em .08em 0 #600}
.stage.missing img{filter:brightness(0) opacity(.55) drop-shadow(0 0 .2em rgba(160,190,255,.35))}
.ph{position:relative;display:grid;place-items:center;width:62%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#fff 0 13%,#151515 13% 18%,transparent 18%),linear-gradient(var(--tc,#888) 0 46%,#151515 46% 54%,#eef0f6 54%);box-shadow:inset 0 0 0 .14em #151515;opacity:.9}
.stage.missing .ph{filter:grayscale(1) brightness(.6)}
.wide{position:relative;display:flex;align-items:center;justify-content:space-between;padding:0 3%}
.wide .lbl{width:auto}
.wide .val{left:auto;right:3%;width:42%;justify-content:flex-end;padding-right:.6em}
.wide.solo{background:linear-gradient(90deg,rgba(0,0,0,0),rgba(10,16,34,.35))}
.foot{display:grid;grid-template-columns:58% 42%;padding:0 0 0 3%}
.remain{display:grid;grid-template-rows:1fr auto;gap:.2em;padding:.25em .6em .35em 0}
.remain .bar2{background:var(--bar);color:var(--bar-ink);text-shadow:.1em .1em 0 var(--bar-shade);display:flex;align-items:center;justify-content:space-between;padding:0 .6em;clip-path:polygon(.55em 0,100% 0,100% 100%,0 100%)}
.exp{display:flex;align-items:center;gap:.4em;font-family:var(--tiny);font-size:.62em;color:#fff;background:#151b2d;padding:.15em .4em;border-radius:.2em}
.exp .track{flex:1;height:.55em;background:#26304a;border-radius:.2em;overflow:hidden;box-shadow:inset 0 0 0 .08em #0a0d16}
.exp .track i{display:block;height:100%;background:linear-gradient(var(--exp) 0 55%,#2a86d6 55%)}
.item{background:linear-gradient(180deg,#e8edf6,#cdd6e6);margin:.25em 0 .35em;border-radius:.3em 0 0 .3em;display:grid;grid-template-rows:1fr 1fr;color:var(--bar-ink);text-shadow:.1em .1em 0 var(--bar-shade);padding:.1em .6em;position:relative}
.item .h{display:flex;justify-content:space-between;align-items:center;border-bottom:.1em solid #b3bdd0}
.item .h i{font-style:normal;color:var(--red);text-shadow:none;font-size:.8em}
.item .v{display:block;align-self:center;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toolbar{background:#0d0f14;display:flex;align-items:stretch;gap:2%;padding:.35em 2%}
.tb{border:0;background:#1d212b;color:#fff;border-radius:.25em;flex:1;display:grid;place-items:center;font-size:1em;box-shadow:inset 0 0 0 .1em #343a4a}
.tb:hover{background:#2a3040}
.tb.x{color:var(--red)}.tb.ok{color:var(--ok)}.tb.back{color:var(--exp)}
.tb.wide2{flex:2.4;font-size:.8em;letter-spacing:.05em}
.dexlist{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;font-size:.78rem;color:var(--muted)}
.dexlist b{color:var(--ink);font-weight:400}
.dexlist span{background:#151d36;border:1px solid var(--line);border-radius:4px;padding:2px 7px}

/* ---------- Box ---------- */
.boxwrap{display:grid;gap:10px;min-width:0}
.boxhead{display:flex;align-items:center;gap:8px}
.arrow{border:0;width:38px;height:38px;border-radius:6px;background:#26325a;color:#fff;box-shadow:0 3px 0 #0a0f1e;font-size:1rem}
.boxname{flex:1;min-width:0;text-align:center;background:var(--bar);color:var(--bar-ink);text-shadow:1px 1px 0 var(--bar-shade);border-radius:6px;padding:7px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.boxname b{font-weight:400;font-size:1.05rem}
.boxname small{font-family:var(--tiny);font-size:.68rem;white-space:nowrap}
.box{--c:#3c5ba6;border-radius:10px;padding:10px;border:3px solid #0a0f1e;box-shadow:inset 0 0 0 2px rgba(255,255,255,.15);
  background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--c) 70%,#0c1222) 0 14px,color-mix(in srgb,var(--c) 55%,#0c1222) 14px 28px)}
.slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.slot{position:relative;aspect-ratio:1;border:0;border-radius:6px;background:rgba(10,15,30,.35);display:grid;place-items:center;padding:0;box-shadow:inset 0 0 0 2px rgba(255,255,255,.08);overflow:visible}
.slot:hover{background:rgba(10,15,30,.55)}
.slot img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.slot.missing img{filter:brightness(0) opacity(.45)}
.hl .slot.caught{opacity:.35}
.slot .no{position:absolute;left:3px;top:2px;font-family:var(--tiny);font-size:.55rem;color:rgba(255,255,255,.75);text-shadow:1px 1px 0 #000}
.slot .sh{position:absolute;right:3px;top:1px;color:var(--red);font-size:.7rem;text-shadow:1px 1px 0 #400}
.slot .ck{position:absolute;right:3px;bottom:3px;width:11px;height:11px;border-radius:50%;background:linear-gradient(var(--red) 0 45%,#111 45% 55%,#fff 55%);box-shadow:0 0 0 1px #111}
.slot .tag{position:absolute;left:0;right:0;bottom:2px;text-align:center;font-family:var(--tiny);font-size:.5rem;color:#fff;text-shadow:1px 1px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
.slot .mini{width:56%;aspect-ratio:1;border-radius:50%;background:linear-gradient(var(--tc,#888) 0 45%,#111 45% 55%,#e9edf5 55%);box-shadow:0 0 0 2px #111}
.slot.missing .mini{filter:grayscale(1) brightness(.55)}
.slot.empty{background:rgba(10,15,30,.18);box-shadow:none;cursor:default}
.slot.sel{background:rgba(255,255,255,.22);box-shadow:inset 0 0 0 2px #fff}
.slot.sel::before{content:"";position:absolute;top:-9px;left:50%;width:0;height:0;border:7px solid transparent;border-top-color:var(--red);transform:translateX(-50%);animation:bob .7s steps(2) infinite;filter:drop-shadow(1px 1px 0 #000);z-index:2}
@keyframes bob{50%{transform:translate(-50%,-3px)}}
@media (prefers-reduced-motion:reduce){.slot.sel::before{animation:none}}
.boxacts{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.btn{border:0;border-radius:5px;padding:7px 11px;background:#26325a;box-shadow:0 3px 0 #0a0f1e;font-size:.82rem}
.btn.warn{background:#5a2633}
.legend{font-size:.75rem;color:var(--muted)}

.overview{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:10px}
.overview h2{margin:0 0 8px;font-weight:400;font-size:.8rem;font-family:var(--tiny);letter-spacing:.12em;color:var(--muted);display:flex;justify-content:space-between}
.minis{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:5px}
.mb{border:0;border-radius:4px;padding:4px 0 5px;background:#1b2546;font-family:var(--tiny);font-size:.62rem;display:grid;gap:3px;justify-items:center}
.mb i{display:block;width:76%;height:4px;background:#0b1020;border-radius:2px;overflow:hidden}
.mb i b{display:block;height:100%;background:var(--exp)}
.mb.done{background:#3b3416;color:#ffe27a}
.mb.done i b{background:#ffd23f}
.mb[aria-current="true"]{box-shadow:inset 0 0 0 2px #fff}

.notice{display:flex;gap:10px;align-items:flex-start;background:#2b2440;border:2px solid #4b3f74;border-radius:8px;padding:9px 12px;font-size:.82rem}
.notice p{margin:0;flex:1}
.notice button{border:0;background:transparent;color:var(--muted)}
details.backup{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.85rem}
details.backup summary{cursor:pointer;font-family:var(--tiny);font-size:.7rem;letter-spacing:.12em;color:var(--muted)}
details.backup textarea{width:100%;min-height:90px;background:#0b1122;border:2px solid var(--line);border-radius:4px;margin:8px 0;padding:6px;font-family:ui-monospace,monospace;font-size:.72rem}
.note{font-size:.75rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--bar);color:var(--bar-ink);padding:7px 14px;border-radius:5px;box-shadow:0 4px 0 #0a0f1e;font-size:.85rem;z-index:10}
</style>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><span class="ball" aria-hidden="true"></span><div><h1>HOME LIVING DEX</h1><small>BOX TRACKER · B2 STYLE</small></div></div>
    <div class="overall" id="overall"></div>
  </header>
  <nav class="carts" id="carts" aria-label="Games"></nav>
  <div class="notice" id="notice" hidden><p id="noticeText"></p><button type="button" id="noticeX" aria-label="Dismiss notice">✕</button></div>
  <section class="controls" aria-label="Living dex options">
    <div class="grp" id="scopes"><span>POKÉDEX</span></div>
    <div class="grp" id="variants"><span>VARIANT</span></div>
    <form class="search" id="searchForm"><input id="q" type="search" placeholder="Name or no. (e.g. crobat, 169)" autocomplete="off" aria-label="Search Pokémon"><button class="chip" type="submit">GO</button></form>
    <label class="toggle"><input type="checkbox" id="quick"> Tap to mark</label>
    <label class="toggle"><input type="checkbox" id="hl"> Highlight missing</label>
  </section>

  <div class="main">
    <div>
      <div class="dsframe">
        <div class="screen" id="screen" aria-live="polite"></div>
      </div>
      <div class="dexlist" id="dexlist"></div>
    </div>
    <div class="boxwrap">
      <div class="boxhead">
        <button class="arrow" type="button" id="prevBox" aria-label="Previous box">◀</button>
        <div class="boxname" id="boxname"></div>
        <button class="arrow" type="button" id="nextBox" aria-label="Next box">▶</button>
      </div>
      <div class="box" id="box"><div class="slots" id="slots"></div></div>
      <div class="boxacts">
        <span class="legend">Click to inspect · double-click or Space to mark · arrow keys to move</span>
        <div style="display:flex;gap:8px">
          <button class="btn" type="button" id="fillBox">Mark box</button>
          <button class="btn warn" type="button" id="clearBox">Clear box</button>
        </div>
      </div>
      <section class="overview"><h2><span>ALL BOXES</span><span id="ovCount"></span></h2><div class="minis" id="minis"></div></section>
      <details class="backup">
        <summary>BACKUP</summary>
        <p class="note">Progress is saved in this browser. Copy the text below to keep it somewhere else, or paste a backup and import it.</p>
        <textarea id="backupText" aria-label="Backup data" spellcheck="false"></textarea>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" type="button" id="copyBk">Copy backup</button>
          <button class="btn" type="button" id="importBk">Import pasted text</button>
        </div>
      </details>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script id="pkdata" type="application/json">__DATA__</script>
<script>
(()=>{
const RAW = JSON.parse(document.getElementById('pkdata').textContent);
const BASE = 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/';
const TYPES = [null,['Normal','#a8a878'],['Fighting','#c03028'],['Flying','#a890f0'],['Poison','#a040a0'],['Ground','#d4a84a'],['Rock','#b8a038'],['Bug','#98b020'],['Ghost','#705898'],['Steel','#a0a0c0'],['Fire','#f08030'],['Water','#5890f0'],['Grass','#68b848'],['Electric','#e8c018'],['Psychic','#f85888'],['Ice','#78c8c8'],['Dragon','#7038f8'],['Dark','#705848'],['Fairy','#e890b0']];
const REG = {1:'Kanto',2:'Johto',3:'Hoenn',4:'Sinnoh',5:'Unova',6:'Kalos',7:'Alola',8:'Galar',9:'Paldea'};
const ROMAN = ['','I','II','III','IV','V','VI','VII','VIII','IX'];
const DEXNAME = {kanto:'Kanto',galar:'Galar',armor:'Isle of Armor',tundra:'Crown Tundra',sinnoh:'Sinnoh',hisui:'Hisui',paldea:'Paldea',kitakami:'Kitakami',blueberry:'Blueberry',lumiose:'Lumiose'};
const ALLREG = ['alola','galar','hisui','paldea'];
const GAMES = [
  {k:'home',s:'HOME',n:'Pokémon HOME',c:'#36c6a8',dex:['nat',...[1,2,3,4,5,6,7,8,9].map(g=>'gen'+g)],reg:ALLREG},
  {k:'za',s:'Z-A',n:'Legends: Z-A',c:'#c4e04a',dex:['lumiose'],reg:ALLREG},
  {k:'sv',s:'SV',n:'Scarlet / Violet',c:'#e0533e',dex:['paldea','kitakami','blueberry'],reg:ALLREG},
  {k:'pla',s:'PLA',n:'Legends: Arceus',c:'#d9b25c',dex:['hisui'],reg:['hisui']},
  {k:'bdsp',s:'BDSP',n:'Diamond / Pearl',c:'#6aa8f0',dex:['sinnoh'],reg:[]},
  {k:'swsh',s:'SwSh',n:'Sword / Shield',c:'#3fa0e0',dex:['galar','armor','tundra'],reg:['alola','galar']},
  {k:'lgpe',s:'LGPE',n:"Let's Go P / E",c:'#f2c230',dex:['kanto'],reg:['alola']},
];
const VARIANTS = [{k:'normal',n:'Normal'},{k:'forms',n:'Forms'},{k:'gender',n:'Genders'},{k:'shiny',n:'Shiny'},{k:'all',n:'All',hint:'Base + forms + genders, each also shiny'}];

const SP = new Map();
RAW.s.forEach(([id,en,ja,gen,t1,t2,gr,fl])=>SP.set(id,{id,en,ja,gen,t:[t1,t2].filter(Boolean),gr,fl}));
const FORMS = new Map();
RAW.f.forEach(([key,sid,label,sk,t1,t2,reg])=>{ if(!FORMS.has(sid))FORMS.set(sid,[]); FORMS.get(sid).push({key,sid,label,sk,t:[t1,t2].filter(Boolean),reg}); });
const GDIFF = new Set(RAW.g);
const DEXNUM = {};
Object.keys(DEXNAME).forEach(d=>{ const m=new Map(); RAW.x[d].forEach((sid,i)=>{ if(!m.has(sid)) m.set(sid,RAW.x[d+'#'][i]); }); DEXNUM[d]=m; });
const ALL_IDS = [...SP.keys()].sort((a,b)=>a-b);

/* ---------- state ---------- */
const STORE='home-livingdex-b2-v1';
let st = {game:'home',scope:{},variant:{},caught:{},sel:{},quick:false,hl:false,noticeOff:false};
try{ const s=JSON.parse(localStorage.getItem(STORE)||'null'); if(s&&typeof s==='object') st=Object.assign(st,s); }catch(e){}
const save=()=>{ try{ localStorage.setItem(STORE,JSON.stringify(st)); }catch(e){} };
const game=()=>GAMES.find(g=>g.k===st.game)||GAMES[0];
const scopeOf=g=>st.scope[g.k]||'all';
const variantOf=g=>st.variant[g.k]||'normal';
const slotKey=(g,v)=>g.k+'|'+v;
const caughtSet=(g,v)=>{ const k=slotKey(g,v); if(!Array.isArray(st.caught[k])) st.caught[k]=[]; return st.caught[k]; };
const caughtLookup={};
function cset(g,v){ const k=slotKey(g,v); const arr=caughtSet(g,v); let c=caughtLookup[k]; if(!c||c.arr!==arr||c.n!==arr.length){ c={arr,n:arr.length,set:new Set(arr)}; caughtLookup[k]=c; } return c.set; }
function setCaught(g,v,key,on){ const arr=caughtSet(g,v); const i=arr.indexOf(key); if(on&&i<0)arr.push(key); if(!on&&i>=0)arr.splice(i,1); save(); }

/* ---------- list building ---------- */
function speciesFor(g,scope){
  if(g.k==='home'){
    if(scope==='all'||scope==='nat') return ALL_IDS;
    const gen=+scope.slice(3); return ALL_IDS.filter(id=>SP.get(id).gen===gen);
  }
  const dexes = scope==='all'? g.dex : [scope];
  const out=[],seen=new Set();
  dexes.forEach(d=>RAW.x[d].forEach(id=>{ if(!seen.has(id)){seen.add(id);out.push(id);} }));
  return out;
}
const listCache=new Map();
function entries(g,scope,variant){
  const ck=g.k+'|'+scope+'|'+variant; if(listCache.has(ck)) return listCache.get(ck);
  const ids=speciesFor(g,scope), out=[];
  const all=variant==='all';
  ids.forEach(id=>{
    const sp=SP.get(id), group=[];
    group.push({key:'s:'+id,sid:id,sk:String(id),t:sp.t,label:'',female:false});
    if(variant==='forms'||all){ (FORMS.get(id)||[]).forEach(f=>{ if(f.reg && !g.reg.includes(f.reg)) return; group.push({key:'f:'+f.key,sid:id,sk:f.sk,t:f.t,label:f.label,female:/female/.test(f.key)}); }); }
    if((variant==='gender'||all) && GDIFF.has(id)){ group.push({key:'g:'+id,sid:id,sk:String(id),t:sp.t,label:'Female',female:true,gfemale:true}); }
    if(variant==='shiny') group.forEach(e=>e.shiny=true);
    out.push(...group);
    if(all) group.forEach(e=>out.push({...e,key:'x:'+e.key,shiny:true}));
  });
  listCache.set(ck,out); return out;
}
function regionalNo(g,scope,sid){
  if(g.k==='home') return sid;
  const dexes=scope==='all'?g.dex:[scope];
  for(const d of dexes){ const n=DEXNUM[d].get(sid); if(n!=null) return n; }
  return sid;
}

/* ---------- sprites ---------- */
let spriteMode='unknown';
function spriteChain(e,animated){
  const sh=e.shiny?'shiny/':'', fe=e.gfemale?'female/':'';
  const bw=BASE+'versions/generation-v/black-white/';
  const chain=[];
  if(animated && e.sid<=649) chain.push(bw+'animated/'+sh+fe+e.sk+'.gif');
  chain.push(bw+sh+fe+e.sk+'.png');
  chain.push(BASE+sh+fe+e.sk+'.png');
  if(fe) chain.push(BASE+sh+e.sk+'.png');
  return chain;
}
function imgEl(chain,alt,onFail,onLoad){
  const im=document.createElement('img'); im.alt=alt; im.decoding='async'; im.loading='lazy';
  let i=0; im.onerror=()=>{ i++; if(i<chain.length) im.src=chain[i]; else onFail(); };
  if(onLoad) im.onload=()=>onLoad(im);
  im.src=chain[0]; return im;
}
(function probe(){
  const im=new Image(); let done=false;
  const fin=m=>{ if(done)return; done=true; spriteMode=m; render(); };
  im.onload=()=>fin('on'); im.onerror=()=>fin('off'); setTimeout(()=>fin('off'),5000);
  im.src=BASE+'versions/generation-v/black-white/169.png';
})();

/* ---------- render ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(3,'0');
const typeColor=t=>(TYPES[t]||TYPES[1])[1];
function pct(a,b){ return b?Math.floor(a*1000/b)/10:0; }

function progressFor(g){ const v=variantOf(g), s=scopeOf(g); const list=entries(g,s,v); const c=cset(g,v); let n=0; for(const e of list) if(c.has(e.key)) n++; return [n,list.length]; }

function renderCarts(){
  const el=$('carts'); el.innerHTML='';
  GAMES.forEach(g=>{
    const [n,t]=progressFor(g);
    const b=document.createElement('button'); b.type='button'; b.className='cart'; b.style.setProperty('--c',g.c);
    b.setAttribute('aria-pressed',String(g.k===st.game));
    b.innerHTML=`<span class="s">${esc(g.s)}</span><span class="n">${esc(g.n)}</span><span class="p"><i style="width:${pct(n,t)}%"></i></span>`;
    b.title=`${g.n}: ${n}/${t}`;
    b.onclick=()=>{ st.game=g.k; save(); render(); };
    el.appendChild(b);
  });
}
function renderControls(){
  const g=game(), s=scopeOf(g), v=variantOf(g);
  const sc=$('scopes'); sc.querySelectorAll('button').forEach(b=>b.remove());
  const scopes = g.k==='home' ? [['all','National'],...[1,2,3,4,5,6,7,8,9].map(n=>['gen'+n,'Gen '+ROMAN[n]])]
    : [...(g.dex.length>1?[['all','Full']]:[]), ...g.dex.map(d=>[d,DEXNAME[d]])];
  scopes.forEach(([k,n])=>{
    const b=document.createElement('button'); b.type='button'; b.className='chip';
    const cur = (g.dex.length===1 && g.k!=='home') ? true : (k===s);
    b.setAttribute('aria-pressed',String(cur));
    const cnt = entries(g,k,'normal').length;
    b.innerHTML=`${esc(n)}<small>${cnt}</small>`;
    b.onclick=()=>{ st.scope[g.k]=k; st.sel[g.k]=0; save(); render(); };
    sc.appendChild(b);
  });
  const vr=$('variants'); vr.querySelectorAll('button').forEach(b=>b.remove());
  VARIANTS.forEach(o=>{
    const b=document.createElement('button'); b.type='button'; b.className='chip';
    b.setAttribute('aria-pressed',String(o.k===v));
    b.textContent=o.n; if(o.hint) b.title=o.hint; b.onclick=()=>{ st.variant[g.k]=o.k; st.sel[g.k]=0; save(); render(); };
    vr.appendChild(b);
  });
  $('quick').checked=!!st.quick; $('hl').checked=!!st.hl;
}

function current(){ const g=game(), s=scopeOf(g), v=variantOf(g); const list=entries(g,s,v); let i=st.sel[g.k+'|'+s+'|'+v]|0; if(i>=list.length)i=list.length-1; if(i<0)i=0; return {g,s,v,list,i}; }
function setSel(i){ const {g,s,v,list}=current(); st.sel[g.k+'|'+s+'|'+v]=Math.max(0,Math.min(list.length-1,i)); save(); renderBox(); renderScreen(); }

function renderBox(){
  const {g,s,v,list,i}=current(); const c=cset(g,v);
  const nb=Math.max(1,Math.ceil(list.length/30)), b=Math.floor(i/30);
  const from=b*30, to=Math.min(list.length,from+30);
  let got=0; for(let k=from;k<to;k++) if(c.has(list[k].key)) got++;
  const firstNo=list[from]?regionalNo(g,s,list[from].sid):0, lastNo=list[to-1]?regionalNo(g,s,list[to-1].sid):0;
  $('boxname').innerHTML=`<b>Box ${b+1}</b><small>No. ${pad(firstNo)}–${pad(lastNo)} · ${got}/${to-from}</small>`;
  $('box').style.setProperty('--c',g.c);
  $('box').classList.toggle('hl',!!st.hl);
  const el=$('slots'); el.innerHTML='';
  for(let k=0;k<30;k++){
    const idx=from+k, e=list[idx];
    const btn=document.createElement('button'); btn.type='button';
    if(!e){ btn.className='slot empty'; btn.disabled=true; btn.setAttribute('aria-hidden','true'); el.appendChild(btn); continue; }
    const sp=SP.get(e.sid), have=c.has(e.key);
    btn.className='slot '+(have?'caught':'missing')+(idx===i?' sel':'');
    btn.setAttribute('aria-label',`${e.shiny?'Shiny ':''}${sp.en}${e.label?' ('+e.label+')':''} no. ${regionalNo(g,s,e.sid)}, ${have?'caught':'missing'}`);
    btn.style.setProperty('--tc',typeColor(e.t[0]));
    const showImg = spriteMode==='on';
    if(showImg){
      btn.appendChild(imgEl(spriteChain(e,false),'',()=>{ const m=document.createElement('span'); m.className='mini'; btn.querySelector('img')?.replaceWith(m); }));
    } else { const m=document.createElement('span'); m.className='mini'; btn.appendChild(m); }
    btn.insertAdjacentHTML('beforeend',`<span class="no">${pad(regionalNo(g,s,e.sid))}</span>${have?'<span class="ck" aria-hidden="true"></span>':''}${e.shiny&&v==='all'?'<span class="sh" aria-hidden="true">★</span>':''}${!showImg||e.label?`<span class="tag">${esc(e.label?shortLabel(e.label):sp.en)}</span>`:''}`);
    btn.onclick=()=>{ if(st.quick){ toggle(idx); } else setSel(idx); };
    btn.ondblclick=()=>{ if(!st.quick) toggle(idx); };
    el.appendChild(btn);
  }
  // overview
  const mi=$('minis'); mi.innerHTML='';
  let total=0;
  for(let bi=0;bi<nb;bi++){
    const f=bi*30,t=Math.min(list.length,f+30); let n=0; for(let k=f;k<t;k++) if(c.has(list[k].key)) n++; total+=n;
    const m=document.createElement('button'); m.type='button'; m.className='mb'+(n===t-f?' done':'');
    if(bi===b) m.setAttribute('aria-current','true');
    m.innerHTML=`${bi+1}<i><b style="width:${pct(n,t-f)}%"></b></i>`; m.title=`Box ${bi+1}: ${n}/${t-f}`;
    m.onclick=()=>setSel(bi*30); mi.appendChild(m);
  }
  $('ovCount').textContent=`${total}/${list.length} · ${nb} BOXES`;
  $('overall').innerHTML=`${esc(g.n)} · ${VARIANTS.find(o=>o.k===v).n}<br><b>${total}</b> / ${list.length} · ${pct(total,list.length)}%`;
  $('prevBox').disabled=b===0; $('nextBox').disabled=b>=nb-1;
}
function shortLabel(l){ return l.replace(/ (Form|Forme|Style|Mode|Pattern|Plumage|Flower|Cloak|Cream|Swirl)\b/g,'').replace(/Strawberry Sweet|Berry Sweet|Love Sweet|Star Sweet|Clover Sweet|Flower Sweet|Ribbon Sweet/,m=>m.split(' ')[0]); }

function renderScreen(){
  const {g,s,v,list,i}=current(); const e=list[i]; const sc=$('screen');
  if(!e){ sc.innerHTML=''; return; }
  const sp=SP.get(e.sid), c=cset(g,v), have=c.has(e.key);
  const no=regionalNo(g,s,e.sid);
  const b=Math.floor(i/30)+1, r=Math.floor((i%30)/6)+1, col=i%6+1;
  let n=0; for(const x of list) if(c.has(x.key)) n++;
  const left=list.length-n;
  const sex = e.gfemale||e.female ? '<span class="sex f">♀</span>' : (sp.gr===-1?'':(sp.gr===8?'<span class="sex f">♀</span>':(sp.gr===0?'<span class="sex m">♂</span>':'')));
  const types=e.t.map(t=>`<span class="type" style="background:${typeColor(t)}">${esc(TYPES[t][0].toUpperCase())}</span>`).join('');
  const varName = (e.label || (v==='gender'?'Male / default':'Base form')) + (e.shiny?' · Shiny':'');
  sc.innerHTML=`
    <div class="head"><div class="plate">
      <div class="l1"><span class="ball" aria-hidden="true"></span><span class="nm">${esc(sp.ja||sp.en)}</span>${sex}</div>
      <div class="l2"><span class="lv">No.${pad(sp.id)}</span><span class="pill ${have?'ok':'miss'}">${have?'IN BOX':'MISSING'}</span></div>
    </div></div>
    <div class="row"><span class="lbl">DEX No.</span><span class="val red">${pad(no)}${g.k!=='home'?` <small>NAT. ${pad(sp.id)}</small>`:''}</span></div>
    <div class="row"><span class="lbl">NAME</span><span class="val">${esc(sp.en)}</span></div>
    <div class="row"><span class="lbl">TYPE</span><span class="val types">${types}</span></div>
    <div class="row"><span class="lbl">ORIGIN</span><span class="val blue">${REG[sp.gen]} · G${ROMAN[sp.gen]}</span></div>
    <div class="row"><span class="lbl">SLOT</span><span class="val">B${b} · ${r}-${col}</span></div>
    <div class="wide solo"><span class="lbl">STATUS IN THIS DEX</span><span class="val">${have?'CAUGHT':'MISSING'}</span></div>
    <div class="wide"><span class="lbl">TO COMPLETE</span><span class="lbl" style="font-size:.7em;opacity:.8">${esc(game().s)} · ${n}/${list.length}</span></div>
    <div class="foot">
      <div class="remain"><div class="bar2"><span>LEFT</span><span>${left}</span></div><div class="exp">DEX<span class="track"><i style="width:${pct(n,list.length)}%"></i></span></div></div>
      <div class="item"><div class="h">VARIANT${e.shiny?'<i>★</i>':''}</div><div class="v">${esc(varName)}</div></div>
    </div>
    <div class="toolbar">
      <button class="tb" type="button" data-a="up" aria-label="Previous Pokémon">▲</button>
      <button class="tb" type="button" data-a="down" aria-label="Next Pokémon">▼</button>
      <button class="tb wide2 ${have?'x':'ok'}" type="button" data-a="toggle">${have?'✕ REMOVE':'✓ MARK'}</button>
      <button class="tb back" type="button" data-a="next" aria-label="Next missing" title="Next missing">⤼</button>
    </div>
    <div class="stage ${have?'':'missing'}" id="stage">${e.shiny?'<span class="star">★</span>':''}</div>`;
  const stage=sc.querySelector('#stage');
  if(spriteMode==='on'){
    stage.appendChild(imgEl(spriteChain(e,true),sp.en,()=>{ stage.querySelector('img')?.remove(); stage.insertAdjacentHTML('beforeend',`<span class="ph" style="--tc:${typeColor(e.t[0])}"></span>`); },im=>{ im.style.setProperty('--nw',im.naturalWidth||96); im.classList.add('ready'); }));
  } else stage.insertAdjacentHTML('beforeend',`<span class="ph" style="--tc:${typeColor(e.t[0])}"></span>`);
  sc.querySelectorAll('.tb').forEach(bt=>bt.onclick=()=>{
    const a=bt.dataset.a;
    if(a==='up') setSel(i-1); else if(a==='down') setSel(i+1); else if(a==='toggle') toggle(i);
    else if(a==='next'){ const j=nextMissing(i); if(j<0) flash('This living dex is complete!'); else setSel(j); }
  });
  // dex membership list
  const dl=$('dexlist'); const parts=[];
  Object.keys(DEXNAME).forEach(d=>{ const m=DEXNUM[d].get(e.sid); if(m!=null) parts.push(`<span>${DEXNAME[d]} <b>${pad(m)}</b></span>`); });
  dl.innerHTML = parts.length? `Appears in: ${parts.join('')}` : 'National Dex only (HOME).';
}
function nextMissing(i){ const {g,v,list}=current(); const c=cset(g,v); for(let k=1;k<=list.length;k++){ const j=(i+k)%list.length; if(!c.has(list[j].key)) return j; } return -1; }
function toggle(idx){ const {g,v,list}=current(); const e=list[idx]; if(!e)return; const on=!cset(g,v).has(e.key); setCaught(g,v,e.key,on); const sp=SP.get(e.sid); st.sel[g.k+'|'+scopeOf(g)+'|'+v]=idx; save(); renderBox(); renderScreen(); renderCarts(); flash(`${e.shiny?'Shiny ':''}${sp.en}${e.label?' ('+e.label+')':''} ${on?'marked':'removed'}`); }

let tt; function flash(m){ const t=$('toast'); t.textContent=m; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,1600); }

function renderNotice(){
  const n=$('notice');
  if(spriteMode==='off' && !st.noticeOff){ $('noticeText').textContent='Black 2 sprites can\'t load in this preview because the page blocks external images, so each slot shows a type-coloured marker. Open the self-hosted copy to see the animated sprites.'; n.hidden=false; }
  else n.hidden=true;
}
function render(){ renderCarts(); renderControls(); renderBox(); renderScreen(); renderNotice(); $('backupText').value=''; }

/* ---------- events ---------- */
$('prevBox').onclick=()=>{ const {i}=current(); setSel(Math.floor(i/30)*30-30); };
$('nextBox').onclick=()=>{ const {i}=current(); setSel(Math.floor(i/30)*30+30); };
$('quick').onchange=e=>{ st.quick=e.target.checked; save(); };
$('hl').onchange=e=>{ st.hl=e.target.checked; save(); renderBox(); };
$('noticeX').onclick=()=>{ st.noticeOff=true; save(); renderNotice(); };
function boxConfirm(btn,label,fn){ if(btn.dataset.arm){ delete btn.dataset.arm; btn.textContent=label; fn(); return; } btn.dataset.arm='1'; btn.textContent='Confirm?'; setTimeout(()=>{ if(btn.dataset.arm){ delete btn.dataset.arm; btn.textContent=label; } },2500); }
function setBox(on){ const {g,v,list,i}=current(); const f=Math.floor(i/30)*30; for(let k=f;k<Math.min(list.length,f+30);k++) setCaught(g,v,list[k].key,on); render(); flash(on?'Box marked':'Box cleared'); }
$('fillBox').onclick=e=>boxConfirm(e.currentTarget,'Mark box',()=>setBox(true));
$('clearBox').onclick=e=>boxConfirm(e.currentTarget,'Clear box',()=>setBox(false));
$('searchForm').onsubmit=e=>{
  e.preventDefault(); const q=$('q').value.trim().toLowerCase(); if(!q) return;
  const {g,s,list}=current();
  const isNum=/^\d+$/.test(q);
  let j=list.findIndex(x=>isNum ? (regionalNo(g,s,x.sid)===+q) : SP.get(x.sid).en.toLowerCase().startsWith(q));
  if(j<0 && isNum) j=list.findIndex(x=>x.sid===+q);
  if(j<0) j=list.findIndex(x=>SP.get(x.sid).en.toLowerCase().includes(q)||SP.get(x.sid).ja.includes(q));
  if(j<0) flash('Not in this Pokédex'); else setSel(j);
};
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea')) return;
  const {i}=current(); const m={ArrowLeft:-1,ArrowRight:1,ArrowUp:-6,ArrowDown:6,PageUp:-30,PageDown:30}[e.key];
  if(m!=null){ e.preventDefault(); setSel(i+m); }
  else if(e.key===' '||e.key==='Enter'){ if(e.target.closest('button')&&e.key==='Enter') return; e.preventDefault(); toggle(i); }
});
document.querySelector('details.backup').addEventListener('toggle',ev=>{ if(ev.target.open) $('backupText').value=JSON.stringify({v:1,caught:st.caught}); });
$('copyBk').onclick=()=>{ const ta=$('backupText'); ta.value=JSON.stringify({v:1,caught:st.caught}); const p=navigator.clipboard?.writeText(ta.value); if(p) p.then(()=>flash('Backup copied')).catch(()=>{ ta.select(); flash('Select and copy the text'); }); else { ta.select(); flash('Select and copy the text'); } };
$('importBk').onclick=()=>{ try{ const d=JSON.parse($('backupText').value); if(!d||typeof d.caught!=='object') throw 0; st.caught=d.caught; save(); render(); flash('Backup imported'); }catch(_){ flash('Invalid text: paste a backup copied from here'); } };

render();
})();
</script>
