<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Showdown Generations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen&family=Press+Start+2P&display=swap">
<style>
/* Layout: tabs for Gen 1–5 on top; a DS frame (per-gen top screen + the unchanged B2 bottom screen) beside a notes card. */
:root{
  --night:#0c1222; --panel:#141d36; --line:#2a3a64; --ink:#e8edf8; --muted:#8c9abb; --gold:#ffd23f; --bar:#dfe6f2; --bar-ink:#3a3f4a;
  --pixel:"DotGothic16","MS Gothic",ui-monospace,monospace; --tiny:"Silkscreen","DotGothic16",ui-monospace,monospace; --gb:"Press Start 2P","Silkscreen",ui-monospace,monospace;
  color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--night:#0c1222}}
:root[data-theme="dark"]{--night:#0c1222}
*{box-sizing:border-box}
html,body{margin:0;background:var(--night);color:var(--ink)}
body{font-family:var(--pixel);padding:20px 16px 40px;background-image:radial-gradient(circle at 1px 1px,rgba(120,150,220,.09) 1px,transparent 0);background-size:12px 12px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid #4ab4ff;outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.cap{font-family:var(--tiny);font-size:.66rem;letter-spacing:.14em;color:var(--muted);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
h1{margin:0;font-weight:400;font-size:1.5rem;letter-spacing:.06em;text-shadow:2px 2px 0 #22355e}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:0;border-radius:6px 6px 3px 3px;padding:8px 12px 9px;min-width:120px;text-align:left;background:linear-gradient(180deg,#2a3558,#1a2240);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),0 3px 0 #070b16;position:relative}
.tab::before{content:"";position:absolute;left:8px;right:8px;top:0;height:4px;background:var(--c);border-radius:0 0 3px 3px}
.tab b{display:block;font-weight:400;font-family:var(--tiny);font-size:.8rem;letter-spacing:.06em;margin-top:2px}
.tab small{display:block;font-size:.68rem;color:var(--muted)}
.tab[aria-selected="true"]{background:linear-gradient(180deg,#3c4f86,#25335e);transform:translateY(-2px)}
.cols{display:grid;grid-template-columns:minmax(0,600px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:920px){.cols{grid-template-columns:minmax(0,1fr)}}
.ds{display:grid;gap:10px}
.shell{background:#0f1526;border:2px solid #2a3352;border-radius:10px;padding:10px}
.cq{container-type:inline-size}
.bottom img{display:block;width:100%;border-radius:4px;opacity:.9}
.bottom figcaption{font-family:var(--tiny);font-size:.58rem;letter-spacing:.12em;color:var(--muted);margin-top:8px;text-align:center}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:6px;padding:8px 12px;background:#222e52;box-shadow:0 2px 0 #0a0f1e;font-family:var(--tiny);font-size:.66rem;letter-spacing:.1em}
.btn.go{background:#c8303c;color:#fff}
.card{background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.card h2{margin:0;font-weight:400;font-family:var(--tiny);font-size:.66rem;letter-spacing:.14em;color:var(--muted)}
.card dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 14px;font-size:.86rem}
.card dt{font-family:var(--tiny);font-size:.6rem;letter-spacing:.1em;color:var(--gold);padding-top:3px}
.card dd{margin:0;line-height:1.45}
.card p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.55}

/* ---------- top screen (1 DS px = --u) ---------- */
.scr{--u:calc(100cqw / 256);position:relative;aspect-ratio:4/3;overflow:hidden;border-radius:4px;background:#f8f8f8;image-rendering:pixelated;color:#000}
.scr .bg{position:absolute;inset:0;background-repeat:no-repeat}
.scr .mon{position:absolute;image-rendering:pixelated;max-width:none}
.scr .hp{position:absolute}
.scr .msg{position:absolute;left:0;right:0;bottom:0;height:calc(var(--u)*48)}
.scr .msg p{margin:0}
.scr .tr{display:block;position:relative;overflow:hidden}
.scr .tr u{display:block;height:100%;text-decoration:none;transition:width .5s steps(12)}
.scr.shake{animation:shake .35s steps(2) 1}
@keyframes shake{25%{transform:translateX(calc(var(--u)*-3))}50%{transform:translateX(calc(var(--u)*3))}75%{transform:translateX(calc(var(--u)*-2))}}
.mon.blink{animation:blink .6s steps(1) 1}
@keyframes blink{0%,25%,50%,75%{visibility:hidden}12%,37%,62%,87%,100%{visibility:visible}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:fl .35s steps(4) 1}
@keyframes fl{30%{opacity:.85}}

/* Gen 1 · Red / Blue (Game Boy) */
.g1,.g2{font-family:var(--gb);background:#f8f8f8}
.g1 .hp,.g2 .hp{font-size:calc(var(--u)*10);line-height:1.15;letter-spacing:0}
.g1 .hp .nm,.g2 .hp .nm{display:block}
.g1 .hp .lv,.g2 .hp .lv{display:block;padding-left:calc(var(--u)*40)}
.g1 .bar,.g2 .bar{display:flex;align-items:center;gap:calc(var(--u)*2);margin-top:calc(var(--u)*3)}
.g1 .bar i,.g2 .bar i{font-style:normal;font-size:calc(var(--u)*8)}
.g1 .tr,.g2 .tr{flex:1;height:calc(var(--u)*5);border:calc(var(--u)*1.4) solid #000;border-radius:calc(var(--u)*3);background:#f8f8f8}
.g1 .tr u{background:#000}
.g2 .tr u{background:var(--hc,#20c040)}
.g1 .hp.foe,.g2 .hp.foe{left:calc(var(--u)*14);top:calc(var(--u)*6);width:calc(var(--u)*124);padding:0 0 calc(var(--u)*6) calc(var(--u)*6)}
.g1 .hp.foe::before,.g2 .hp.foe::before{content:"";position:absolute;left:0;right:0;top:calc(var(--u)*24);bottom:0;border-left:calc(var(--u)*1.6) solid #000;border-bottom:calc(var(--u)*1.6) solid #000}
.g1 .hp.foe::after,.g2 .hp.foe::after{content:"";position:absolute;right:calc(var(--u)*-4);bottom:calc(var(--u)*-3.6);border:calc(var(--u)*2.6) solid transparent;border-left:calc(var(--u)*5) solid #000}
.g1 .hp.me,.g2 .hp.me{right:calc(var(--u)*12);top:calc(var(--u)*80);width:calc(var(--u)*124);padding:0 calc(var(--u)*6) calc(var(--u)*4) calc(var(--u)*4)}
.g1 .hp.me::before,.g2 .hp.me::before{content:"";position:absolute;left:0;right:0;top:calc(var(--u)*26);bottom:0;border-right:calc(var(--u)*1.6) solid #000;border-bottom:calc(var(--u)*1.6) solid #000}
.g1 .hp.me::after,.g2 .hp.me::after{content:"";position:absolute;left:calc(var(--u)*-6);bottom:calc(var(--u)*-3.6);border:calc(var(--u)*2.6) solid transparent;border-right:calc(var(--u)*5) solid #000}
.g1 .num,.g2 .num{text-align:right;margin-top:calc(var(--u)*3)}
.g1 .msg,.g2 .msg{background:#f8f8f8;box-shadow:inset 0 0 0 calc(var(--u)*2) #f8f8f8,inset 0 0 0 calc(var(--u)*4) #000,inset 0 0 0 calc(var(--u)*5.5) #f8f8f8,inset 0 0 0 calc(var(--u)*6.5) #000;padding:calc(var(--u)*11) calc(var(--u)*15);font-size:calc(var(--u)*9.5);line-height:1.55}
.g2 .msg{box-shadow:inset 0 0 0 calc(var(--u)*2) #f8f8f8,inset 0 0 0 calc(var(--u)*5) #405880,inset 0 0 0 calc(var(--u)*6.5) #f8f8f8,inset 0 0 0 calc(var(--u)*7.5) #405880}
.g2 .hp .g{color:#3068e0}

/* Gen 3 · Ruby / Sapphire (GBA) */
.g3{font-family:var(--pixel)}
.g3 .hp,.g4 .hp{font-size:calc(var(--u)*10);line-height:1.1}
.g3 .hp{background:#f8f8d8;border:calc(var(--u)*2) solid #405048;box-shadow:calc(var(--u)*2) calc(var(--u)*2) 0 rgba(0,0,0,.25);padding:calc(var(--u)*4) calc(var(--u)*8) calc(var(--u)*5)}
.g3 .hp.foe{left:calc(var(--u)*12);top:calc(var(--u)*18);width:calc(var(--u)*118);border-radius:calc(var(--u)*6) 0 calc(var(--u)*14) 0}
.g3 .hp.me{right:calc(var(--u)*8);top:calc(var(--u)*86);width:calc(var(--u)*124);border-radius:calc(var(--u)*14) 0 0 calc(var(--u)*6)}
.g3 .row,.g4 .row,.g5 .row{display:flex;justify-content:space-between;gap:calc(var(--u)*4);align-items:baseline}
.g3 .bar,.g4 .bar,.g5 .bar{display:flex;align-items:center;gap:calc(var(--u)*2);margin-top:calc(var(--u)*3)}
.g3 .bar i{font-style:normal;font-family:var(--tiny);font-size:calc(var(--u)*6);background:#f8a800;color:#f8f8d8;padding:0 calc(var(--u)*2);border-radius:calc(var(--u)*2)}
.g3 .tr{flex:1;height:calc(var(--u)*4);background:#506058;border:calc(var(--u)*1) solid #405048;border-radius:calc(var(--u)*2)}
.g3 .tr u,.g4 .tr u,.g5 .tr u{background:var(--hc,#40d070)}
.g3 .num,.g4 .num{text-align:right;margin-top:calc(var(--u)*2)}
.g3 .exp,.g4 .exp{height:calc(var(--u)*3);margin-top:calc(var(--u)*3);background:#506058;border-radius:calc(var(--u)*2);overflow:hidden}
.g3 .exp i,.g4 .exp i{display:block;height:100%;width:62%;background:#48b8f8}
.g3 .g,.g4 .g{color:#3870e8}
.g3 .msg{background:#284858;box-shadow:inset 0 0 0 calc(var(--u)*2) #c8b878,inset 0 0 0 calc(var(--u)*4) #284858;border-top:calc(var(--u)*2) solid #182830;color:#f8f8f8;padding:calc(var(--u)*11) calc(var(--u)*14);font-size:calc(var(--u)*13);line-height:1.35;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #687880}

/* Gen 4 · Diamond / Pearl (DS) */
.g4{font-family:var(--pixel)}
.g4 .hp{background:linear-gradient(#f8f8f8,#d8d8d8);border:calc(var(--u)*1.6) solid #383838;padding:calc(var(--u)*4) calc(var(--u)*8) calc(var(--u)*5)}
.g4 .hp.foe{left:0;top:calc(var(--u)*16);width:calc(var(--u)*124);border-left:0;border-radius:0 calc(var(--u)*10) calc(var(--u)*10) 0;padding-left:calc(var(--u)*10)}
.g4 .hp.me{right:0;top:calc(var(--u)*94);width:calc(var(--u)*126);border-right:0;border-radius:calc(var(--u)*10) 0 0 calc(var(--u)*10)}
.g4 .bar i{font-style:normal;font-family:var(--tiny);font-size:calc(var(--u)*6);background:#384048;color:#f8d030;padding:0 calc(var(--u)*2);border-radius:calc(var(--u)*1)}
.g4 .tr{flex:1;height:calc(var(--u)*4);background:#384048;border:calc(var(--u)*1) solid #202020;border-radius:calc(var(--u)*1)}
.g4 .msg{background:#f8f8f8;border:calc(var(--u)*3) solid #6880a8;box-shadow:inset 0 0 0 calc(var(--u)*1.5) #d0d8e8;border-radius:calc(var(--u)*4);padding:calc(var(--u)*9) calc(var(--u)*13);font-size:calc(var(--u)*13);line-height:1.35;color:#383838;text-shadow:calc(var(--u)*1) calc(var(--u)*1) 0 #c0c0c8}

/* Gen 5 · current look */
.g5{font-family:var(--pixel);color:#fff}
.g5 .hp{background:rgba(28,32,48,.92);border-radius:calc(var(--u)*5);box-shadow:inset 0 0 0 calc(var(--u)*1) #4a5370,0 calc(var(--u)*2) 0 rgba(0,0,0,.35);padding:calc(var(--u)*4) calc(var(--u)*7) calc(var(--u)*5);font-size:calc(var(--u)*9.5)}
.g5 .hp.foe{left:calc(var(--u)*7);top:calc(var(--u)*11);width:calc(var(--u)*112)}
.g5 .hp.me{right:calc(var(--u)*7);top:calc(var(--u)*100);width:calc(var(--u)*118)}
.g5 .bar i{font-style:normal;font-family:var(--tiny);font-size:calc(var(--u)*5.5);color:#f8b800}
.g5 .tr{flex:1;height:calc(var(--u)*4);background:#10131d;border-radius:calc(var(--u)*2);box-shadow:inset 0 0 0 calc(var(--u)*.6) #3b4258}
.g5 .num{text-align:right;margin-top:calc(var(--u)*2);font-size:calc(var(--u)*10)}
.g5 .exp{display:none}
.g5 .g{color:#8fb8ff}
.g5 .balls{position:absolute;display:flex;gap:calc(var(--u)*1)}
.g5 .balls i{width:calc(var(--u)*7);height:calc(var(--u)*7);border-radius:50%;background:linear-gradient(#e83a3a 0 44%,#151515 44% 56%,#f4f4f4 56%);box-shadow:0 0 0 calc(var(--u)*.6) #151515}
.g5 .msg{background:linear-gradient(#26315a,#1b2240);border-top:calc(var(--u)*1) solid #6a7cb8;padding:calc(var(--u)*13) calc(var(--u)*10);font-size:calc(var(--u)*9.5)}
</style>
</head>
<body>
<div class="wrap">
  <div class="cap"><span>MOCK · SHOWDOWN TOP SCREEN BY GENERATION</span><span>SAME BATTLE IN EVERY GEN · NOT APPLIED YET</span></div>
  <h1>SHOWDOWN</h1>
  <div class="tabs" role="tablist" aria-label="Generation" id="tabs"></div>
  <div class="cols">
    <div class="ds">
      <div class="shell cq"><div class="scr" id="scr"></div></div>
      <figure class="shell bottom" style="margin:0"><img id="bot" alt="B2 touch menu"><figcaption>BOTTOM SCREEN · SAME B2 TOUCH MENU IN EVERY GEN</figcaption></figure>
    </div>
    <div class="card">
      <h2 id="nTitle"></h2>
      <dl id="nList"></dl>
      <div class="acts"><button class="btn go" type="button" id="hit">▶ HIT GENGAR</button><button class="btn" type="button" id="reset">RESET HP</button></div>
      <p>Try the hit in each gen: Gen 1 keeps the black bar, from Gen 2 on it goes green → yellow → red. Gen 1–2 shake the screen like the Game Boy games, later gens blink the Pokémon.</p>
    </div>
  </div>
</div>

const $=id=>document.getElementById(id);
const G={
  1:{t:'GEN 1',s:'Red / Blue',c:'#e04a3a',sc:1.5,foe:[198,86],me:[60,145],up:true,lv:':L',bg:null,
     notes:[['SPRITES','Pokémon Red / Blue, Super Game Boy colours. Back sprites are the blocky doubled ones from the cartridge.'],['BACKGROUND','Plain white, like the Game Boy screen.'],['HP BOXES','Name, :L74 and a black HP bar framed by the classic corner lines.'],['TEXT','Game Boy font, all caps, double-line text box.'],['EFFECTS','Simple: screen shake and blink, no modern particles.']]},
  2:{t:'GEN 2',s:'Silver',c:'#a8b0c0',sc:1.5,foe:[198,86],me:[60,145],up:true,lv:':L',gender:true,bg:null,
     notes:[['SPRITES','Pokémon Silver, front and back.'],['BACKGROUND','White, like Gen 1.'],['HP BOXES','Same Game Boy layout, now with a green bar and ♂/♀.'],['TEXT','Game Boy font with the Silver blue frame.'],['EFFECTS','Shake and blink, plus a light flash for big hits.']]},
  3:{t:'GEN 3',s:'Ruby / Sapphire',c:'#d0453a',sc:1.3,foe:[192,100],me:[70,148],up:true,lv:'Lv',gender:true,exp:true,bg:'bg3',
     notes:[['SPRITES','Pokémon Ruby / Sapphire, front and back.'],['BACKGROUND','The GBA field with the grass ovals (also cave, sand, ocean and forest versions).'],['HP BOXES','Cream boxes with the yellow HP tag and the blue EXP bar.'],['TEXT','Dark text box with a gold frame, names in caps.'],['EFFECTS','Our move effects, toned down.']]},
  4:{t:'GEN 4',s:'Diamond / Pearl',c:'#7a9ad8',sc:1.05,foe:[193,101],me:[66,150],up:true,lv:'Lv',gender:true,exp:true,bg:'bg4',
     notes:[['SPRITES','Pokémon Diamond / Pearl, front and back.'],['BACKGROUND','The DS field (also water, snow, cave and indoor versions).'],['HP BOXES','Silver boxes that come in from the screen edges.'],['TEXT','White text box with the blue-grey frame.'],['EFFECTS','Our full move effects.']]},
  5:{t:'GEN 5',s:'Black 2 · now',c:'#5a8ac8',sc:1.25,foe:[188,108],me:[72,158],up:false,lv:'Lv',gender:true,bg:'bg5',anim:true,
     notes:[['SPRITES','Black / White animated sprites, sized by the Pokémon’s height. This is what you have today.'],['BACKGROUND','The B2 battle backgrounds we already use.'],['HP BOXES','Our dark boxes with the party balls.'],['TEXT','The current dark blue bar.'],['EFFECTS','Full Showdown move effects and weather.']]},
};
let cur=1, hpF=100;
const hc=p=>p>50?'#40d070':p>20?'#f8c800':'#f83800';
function render(){
  const g=G[cur], scr=$('scr');
  scr.className='scr g'+cur;
  const nm=n=>g.up?n.toUpperCase():n;
  const foe=A['g'+cur+'f94'], me=A['g'+cur+'b6'];
  const bg=g.bg?(cur===5?`background-image:url(${A.bg5});background-size:cover;background-position:center 70%`:`background-image:url(${A[g.bg]});background-size:100% auto;background-position:top`):'';
  const sex=s=>g.gender?`<span class="g">${s}</span>`:'';
  const lv=n=>`<span class="lv">${g.lv}${n}</span>`;
  const head=(n,s,l)=>cur<=2?`<span class="nm">${nm(n)}${cur===2?' '+sex(s):''}</span>${lv(l)}`:`<div class="row"><span class="nm">${nm(n)} ${sex(s)}</span>${lv(l)}</div>`;
  const hpC=cur===1?'#000':hc(hpF);
  scr.innerHTML=`<div class="bg" style="${bg}"></div>
    <img class="mon foe" id="foe" alt="Gengar" src="${foe.u}" style="${pos(foe,g.foe,g.sc,cur===5?1.0:1)}">
    <img class="mon me" alt="Charizard" src="${me.u}" style="${pos(me,g.me,g.sc*(cur===1?1:1),0)}">
    <div class="hp foe">${head('Gengar','♂',72)}<div class="bar"><i>HP${cur<=2?':':''}</i><span class="tr"><u id="hpu" style="width:${hpF}%;--hc:${hpC}"></u></span></div></div>
    <div class="hp me">${head('Charizard','♀',74)}<div class="bar"><i>HP${cur<=2?':':''}</i><span class="tr"><u style="width:100%;--hc:#40d070"></u></span></div><div class="num">236/ 236</div>${g.exp?'<div class="exp"><i></i></div>':''}</div>
    ${cur===5?`<div class="balls" style="left:calc(var(--u)*9);top:calc(var(--u)*40)">${'<i></i>'.repeat(6)}</div><div class="balls" style="right:calc(var(--u)*9);top:calc(var(--u)*90)">${'<i></i>'.repeat(6)}</div>`:''}
    <div class="msg"><p>What will<br>${nm('Charizard')} do?</p></div>
    <div class="flash" id="flash"></div>`;
  $('nTitle').textContent=`${g.t} · ${g.s.toUpperCase()}`;
  $('nList').innerHTML=g.notes.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('');
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',String(+t.dataset.g===cur)));
}
function pos(sp,[cx,by],sc){
  const w=sp.w*sc, h=sp.h*sc;
  return `width:calc(var(--u)*${w.toFixed(1)});height:calc(var(--u)*${h.toFixed(1)});left:calc(var(--u)*${(cx-w/2).toFixed(1)});top:calc(var(--u)*${(by-h).toFixed(1)})`;
}
$('tabs').innerHTML=Object.entries(G).map(([k,g])=>`<button class="tab" type="button" role="tab" data-g="${k}" style="--c:${g.c}"><b>${g.t}</b><small>${g.s}</small></button>`).join('');
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ cur=+t.dataset.g; render(); });
$('bot').src=A.bottom;
$('hit').onclick=()=>{
  hpF=hpF>62?62:hpF>34?34:hpF>12?12:100;
  const u=$('hpu'); u.style.width=hpF+'%'; u.style.setProperty('--hc',cur===1?'#000':hc(hpF));
  const f=$('foe'); f.classList.remove('blink'); void f.offsetWidth; f.classList.add('blink');
  const s=$('scr');
  if(cur<=2){ s.classList.remove('shake'); void s.offsetWidth; s.classList.add('shake'); }
  else if(cur===5){ const fl=$('flash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on'); }
};
$('reset').onclick=()=>{ hpF=100; render(); };
render();
</script>
